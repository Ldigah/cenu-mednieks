name: Price tracker

on:
  schedule:
    # 05:00, 13:00, 21:00 UTC = 07:00, 15:00, 23:00 Latvia time (winter, EET=UTC+2).
    # GitHub cron has no DST: in summer these land an hour earlier local time.
    - cron: '0 5,13,21 * * *'
  workflow_dispatch: {}     # manual trigger from the Actions tab (instant command processing)
  repository_dispatch:      # triggered by the Cloudflare Worker on /add /remove /check …
    types: [command-run]

permissions:
  contents: read          # checkout needs read access; nothing is ever written — state lives in a gist

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        # Cloudflare-guarded LV aggregators (salidzini/kurpirkt/ceno) go through
        # ScraperAPI when SCRAPERAPI_KEY is set (free plan, ~480 credits/month);
        # without the key they fall back to the requests→Playwright ladder.
        run: python scraper.py

      - name: Publish web snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'repository_dispatch'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python site.py --out site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'repository_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main' && github.event_name != 'repository_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
