name: Weekly health check

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC = 08:00 Latvia (winter)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # A real end-to-end probe of every offer, on the same path as the scheduled runs:
      # the aggregators go through ScraperAPI and a blocked Amazon fetch gets its
      # ScraperAPI rescue. Costs about 65 credits a week (six pages behind bot
      # protection at 10 each, plus any Amazon rescue at 5). Without the key those
      # offers would fail here and report a problem the scheduled runs don't have.
      - name: Run health check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scraper.py --health
